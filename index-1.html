<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111113">
<title>Світло? Графік відключень</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="topbar"></div>
<div id="app">
  <header>
    <h1>Графік відключень світла <b id="regionName"></b></h1>
    <div class="seg" id="regions" role="tablist"></div>
    <div class="refresh-row">
      <button class="refresh" id="refresh" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 12A9 9 0 0 1 18.5 5.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg><span id="refreshTxt">Оновити</span></button>
      <div class="upd" id="updInfo"></div>
    </div>
    <div id="alerts"></div>
    <section class="follow" id="follow"></section>
    <div id="demoNote" class="note" hidden>Показано демо-дані. Реальні графіки з’являться після першого запуску GitHub Actions.</div>
    <section class="addr-card" id="addrCard"></section>
  </header>
  <nav class="qstrip" id="qstrip" aria-label="Черги"></nav>
  <div class="qhead" id="qhead"></div>
  <section class="card" id="today"></section>
  <section class="card" id="tomorrow"></section>
  <section class="card" id="stats"></section>
  <section class="card" id="settings"></section>
  <section id="history"></section>
  <p class="foot" id="foot"></p>
</div>
<div id="sheet" hidden></div>
<div id="flash" aria-live="polite"></div>
<button id="totop" type="button" aria-label="Вгору" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
