name: Update outage data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download schedules
        run: |
          BASE=https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data
          mkdir -p data
          for f in kyiv kyiv-region; do
            if curl -fsS "$BASE/$f.json" -o "/tmp/$f.json" && jq -e '.preset.data' "/tmp/$f.json" >/dev/null; then
              cp "/tmp/$f.json" "data/$f.json"
            else
              echo "skip $f"
            fi
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update outage data" && git push)
